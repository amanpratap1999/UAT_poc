name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Backend Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install ruff
      - name: Run Ruff
        run: ruff check src tests

  type-check:
    name: Backend Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies from lockfile
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --no-deps -e .
          pip install mypy
      - name: Run Mypy
        run: mypy --strict src

  security:
    name: Dependency Audit & Freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit pip-tools cyclonedx-bom
      - name: Verify dependency lock freshness
        run: |
          pip-compile --generate-hashes --output-file=/tmp/requirements.txt pyproject.toml
          diff -u requirements.txt /tmp/requirements.txt
      - name: Scan lockfile for vulnerabilities
        run: |
          pip-audit -r requirements.txt
      - name: Generate Python SBOM
        run: |
          cyclonedx-py requirements requirements.txt --of JSON --output-file python-sbom.json
      - name: Upload Python SBOM
        uses: actions/upload-artifact@v4
        with:
          name: python-sbom
          path: python-sbom.json

  filesystem-scan:
    name: Repository Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  test:
    name: Backend Test (pytest)
    # Runs independently of lint/type-check so backend regression tests always
    # execute and report, even when a lint or typing job fails (QA-001).
    runs-on: ubuntu-latest
    env:
      UAT_RUNTIME_MODE: local
      ENVIRONMENT: development
      JWT_SECRET_KEY: ci-local-development-secret-not-used-in-prod-000
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend dependencies from lockfile
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --no-deps -e .
          pip install pytest-cov
      - name: Run backend regression suite with coverage
        run: pytest tests/ -q --tb=short --cov=src --cov-report=xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  frontend:
    name: Frontend (typecheck + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Type-check (tsc -b)
        run: npx tsc -b
      - name: Unit tests (vitest)
        run: npx vitest run
      - name: Production build
        run: npm run build
      - name: Generate frontend SBOM
        run: npm sbom --sbom-format=cyclonedx > frontend-sbom.json
      - name: Upload frontend SBOM
        uses: actions/upload-artifact@v4
        with:
          name: frontend-sbom
          path: frontend/frontend-sbom.json
