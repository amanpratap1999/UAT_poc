name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    env:
      UAT_RUNTIME_MODE: local
      ENVIRONMENT: development
      JWT_SECRET_KEY: ci-local-development-secret-not-used-in-prod-000
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Run backend regression suite
        run: pytest tests/ -q --tb=short

      - name: Regression gate summary
        if: always()
        run: |
          echo "Backend CI complete. Any failure above blocks the PR."

  frontend:
    name: Frontend (typecheck + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check (tsc -b)
        run: npx tsc -b

      - name: Unit tests (vitest)
        run: npx vitest run

      - name: Production build
        run: npm run build
