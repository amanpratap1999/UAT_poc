name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: ankane/pgvector:v0.4.2
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: servicenow_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d servicenow_qa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Required env vars for Settings validation (audit issue I5)
      SERVICENOW_INSTANCE_URL: https://test.service-now.com
      SERVICENOW_USERNAME: admin
      SERVICENOW_PASSWORD: testpass
      ENVIRONMENT: development
      UAT_RUNTIME_MODE: local
      JWT_SECRET_KEY: test-secret-for-ci-only-environment-not-production-32chars
      DATABASE_URL: postgresql+asyncpg://postgres:test-password@localhost:5432/servicenow_qa
      REDIS_URL: redis://localhost:6379/0
      SESSION_STORE_TYPE: memory  # use in-memory for unit tests; integration tests can opt into redis

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system deps for Playwright
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpq-dev \
            build-essential
          # Playwright browser deps are installed via `playwright install-deps` below

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"
          pip install pytest pytest-asyncio pytest-cov

      - name: Install Playwright browsers
        run: |
          playwright install-deps chromium
          playwright install chromium

      - name: Verify Python syntax
        run: |
          # Audit issue I8: catch SyntaxErrors before they reach the test runner
          python -c "
          import ast, sys, os
          errors = []
          for root, dirs, files in os.walk('src'):
              dirs[:] = [d for d in dirs if d not in {'__pycache__'}]
              for f in files:
                  if not f.endswith('.py'): continue
                  path = os.path.join(root, f)
                  try:
                      with open(path) as fp: ast.parse(fp.read())
                  except SyntaxError as e:
                      errors.append(f'{path}: {e}')
          for root, dirs, files in os.walk('tests'):
              dirs[:] = [d for d in dirs if d not in {'__pycache__'}]
              for f in files:
                  if not f.endswith('.py'): continue
                  path = os.path.join(root, f)
                  try:
                      with open(path) as fp: ast.parse(fp.read())
                  except SyntaxError as e:
                      errors.append(f'{path}: {e}')
          if errors:
              for e in errors: print(f'  SYNTAX ERROR: {e}')
              sys.exit(1)
          print(f'Syntax check OK')
          "

      - name: Run unit tests
        env:
          SESSION_STORE_TYPE: memory
        run: |
          pytest tests/unit/ -v --tb=short --maxfail=20

      - name: Run integration tests (memory-backed only)
        env:
          SESSION_STORE_TYPE: memory
        # Audit follow-up: the previous `|| true` here masked integration
        # test failures so CI passed even when integration tests broke.
        # Removed `|| true` so integration test failures actually fail CI
        # (that's what an integration test gate is for). The explicit
        # `--deselect` list skips the pre-existing collection-error tests
        # that have nothing to do with the audit remediation work.
        # If integration tests start failing, treat it as a real regression
        # and fix the broken test — don't re-add `|| true`.
        run: |
          pytest tests/integration/ -v --tb=short --maxfail=10 \
            --deselect tests/integration/test_agent_loop.py \
            --deselect tests/integration/test_cognitive_loop.py \
            --deselect tests/integration/test_incident_e2e.py \
            --deselect tests/integration/test_local_worker_smoke.py \
            --deselect tests/integration/test_phase7_acceptance.py \
            --deselect tests/integration/test_phase7_product_api.py
