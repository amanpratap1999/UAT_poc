server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Audit issue I39 (P2): security headers (were completely missing).
    # - X-Content-Type-Options: nosniff — prevents MIME-type sniffing
    #   (browser feature that can be abused for XSS).
    # - X-Frame-Options: DENY — prevents clickjacking by embedding the
    #   SPA in an <iframe> on a malicious site.
    # - Referrer-Policy: no-referrer — prevents leaking the bearer token
    #   in the Referer header when the SPA links out to external sites.
    # - X-XSS-Protection: 0 — modern browsers ignore this header, and
    #   the Auditor feature it controlled has been removed; setting 0
    #   disables legacy-XSS-Auditor-based XSS filters that had bypass
    #   bugs. The modern defense is CSP (next item).
    # NOTE: Content-Security-Policy is intentionally not set here because
    # the SPA uses inline scripts/styles + Vite dev/runtime that need
    # per-deployment nonces. Operators should add a CSP in their
    # production reverse-proxy layer (e.g., Cloudflare/CloudFront) that
    # computes nonces per-request.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-XSS-Protection "0" always;

    # SPA fallback — all non-asset paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend service
    # The backend is reachable at http://api:8000 within the Docker network
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Audit issue I39 (P2): rate limit on /api/ to slow brute-force
        # login attempts at the proxy layer (defense-in-depth with the
        # app-layer rate-limit in auth_router.py).
        # 10 requests/second per IP, burst of 20 — accommodates a
        # legitimate browser's parallel API calls during page load
        # but blocks obvious scanner patterns.
        limit_req zone=api_limit burst=20 nodelay;
    }

    # Cache static assets
    location ~* \.(js|css|woff2?|ttf|otf|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Audit issue I39 (P2): re-apply the security headers on static
        # assets too — nginx `add_header` only inherits to nested
        # location blocks if NO add_header is set in the nested block.
        # The `Cache-Control` line above means the security headers
        # above won't apply here unless we re-add them.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Health check endpoint
    location /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;
}

# Audit issue I39 (P2): rate-limit zone for /api/. Declared outside the
# server block so it's allocated once at nginx startup (not per-request).
# 10MB zone stores ~160k IP addresses (10MB / 64 bytes per entry).
# Rate: 10 requests/second per IP (legitimately covers SPA's parallel
# API calls during page load).
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
