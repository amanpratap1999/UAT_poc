[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "servicenow-qa-agent"
version = "1.0.0"
description = "Autonomous AI-powered QA Agent for ServiceNow Incident Management"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "UAT Team"},
]

dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "playwright>=1.48.0",
    "openai>=1.50.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "structlog>=24.4.0",
    "jinja2>=3.1.4",
    "python-dotenv>=1.0.0",
    "redis[hiredis]>=5.0.0",
    "Pillow>=10.0.0",
    "httpx>=0.27.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.2",
    "browser-use>=0.1.30",
    "celery>=5.4.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt==3.2.2",
    "moondream>=0.0.3",
    "google-generativeai>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Correctness gate (ruff defaults): real bugs — undefined names, unused imports,
# syntax errors. Stylistic rules (E501 etc.) were temporarily relaxed during
# stabilization; progressively re-tighten toward ["E", "F", "I", "N", "W", "UP",
# "B", "SIM", "RUF"] in follow-up PRs.
select = ["E4", "E7", "E9", "F"]
